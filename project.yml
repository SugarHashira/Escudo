name: Escudo

include:
  - path: project.local.yml
    optional: true

options:
  bundleIdPrefix: com.sugarhashira
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  ConfettiSwiftUI:
    url: https://github.com/simibac/ConfettiSwiftUI
    from: "1.0.0"
  Popovers:
    url: https://github.com/aheze/Popovers
    from: "1.3.0"
  CrookedText:
    url: https://github.com/duemunk/CrookedText
    from: "0.0.1"
  IsScrolling:
    url: https://github.com/fatbobman/IsScrolling
    from: "1.0.0"
  SwiftUIIntrospect:
    url: https://github.com/siteline/SwiftUI-Introspect
    from: "1.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Escudo:
    type: application
    platform: iOS
    sources:
      - path: Escudo/Sources
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: ConfettiSwiftUI
      - package: Popovers
      - package: CrookedText
      - package: IsScrolling
      - package: SwiftUIIntrospect
    info:
      path: Escudo/Supporting/Info.plist
      properties:
        CFBundleDisplayName: Escudo
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: "Used to protect your financial data"
        NSCameraUsageDescription: "Used to attach photos to transactions"
        NSPhotoLibraryUsageDescription: "Used to attach photos to transactions"
        CFBundleURLTypes:
          - CFBundleURLName: com.sugarhashira.Escudo
            CFBundleURLSchemes:
              - escudo
        CFBundleIcons:
          CFBundleAlternateIcons:
            AppIcon1:
              CFBundleIconFiles:
                - AppIcon1
              UIPrerenderedIcon: false
            AppIcon2:
              CFBundleIconFiles:
                - AppIcon2
              UIPrerenderedIcon: false
            AppIcon3:
              CFBundleIconFiles:
                - AppIcon3
              UIPrerenderedIcon: false
            AppIcon4:
              CFBundleIconFiles:
                - AppIcon4
              UIPrerenderedIcon: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sugarhashira.Escudo
        INFOPLIST_FILE: Escudo/Supporting/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_ENTITLEMENTS: Escudo/Supporting/Escudo.entitlements

  EscudoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Escudo/Tests
    dependencies:
      - target: Escudo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sugarhashira.EscudoTests

schemes:
  Escudo:
    build:
      targets:
        Escudo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EscudoTests
    profile:
      config: Release
    archive:
      config: Release
